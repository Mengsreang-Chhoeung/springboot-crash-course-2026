spring:
  application:
    name: task-management-api-2

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5424/task_api}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mvc:
    problemdetails:
      enabled: true
